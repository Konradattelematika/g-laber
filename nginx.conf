# nginx für den statischen Astro-Build.
#
# Astro baut mit trailingSlash: 'never', legt die Seiten aber als
# impressum/index.html ab. Ohne eigene Konfiguration schickt nginx /impressum
# per 301 auf /impressum/ — und zwar als absolute URL mit dem internen Schema,
# also auf http://. Jeder Footer-Link und jede Sitemap-URL lief dadurch über
# einen überflüssigen Redirect durch Klartext-HTTP.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # Redirects relativ ausgeben, damit das https-Schema erhalten bleibt
    absolute_redirect off;

    location = / {
        try_files /index.html =404;
    }

    # /impressum direkt aus impressum/index.html bedienen — ohne Redirect
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Gehashte Astro-Assets und die self-gehostete Schrift ändern sich nie
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml;
    gzip_min_length 512;
}
